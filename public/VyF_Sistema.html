<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>V&F Jewelry & Parfum — Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold2:#E8D08A;--gold3:#8B6914;--ink:#0C0C0C;--ink2:#1A1510;--ink3:#2A241C;--surf:#141210;--card:#1A1510;--card2:#201C16;--fb:#2A2218;--ft:#F5EDD8;--muted:#7A7060;--muted2:#5A5040;--border:rgba(201,168,76,.18);--borderl:rgba(201,168,76,.35);--ok:#2ECC71;--err:#E74C3C;--warn:#F0A500;--inf:#3498DB;--r:6px;--r2:10px;--r3:14px;--shadow:0 4px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--surf);color:var(--ft);font-size:13px;line-height:1.5;min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500}
/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 30% 30%,rgba(201,168,76,.08),transparent 55%),radial-gradient(ellipse at 70% 70%,rgba(201,168,76,.05),transparent 50%),var(--surf)}
.login-box{background:var(--card);border:1px solid var(--borderl);border-radius:var(--r3);padding:40px 36px;width:100%;max-width:400px;text-align:center;box-shadow:var(--shadow)}
.login-logo{width:80px;height:80px;object-fit:contain;margin:0 auto 20px;filter:drop-shadow(0 0 16px rgba(201,168,76,.5))}
.login-box h1{font-size:24px;color:var(--gold);letter-spacing:3px;margin-bottom:4px}
.login-box .sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:30px}
.l-err{font-size:12px;color:var(--err);margin-top:10px;min-height:18px}
.l-link{font-size:11px;color:var(--muted);margin-top:14px;cursor:pointer;text-decoration:underline}
.l-link:hover{color:var(--gold)}
/* FORMS */
label{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--gold2);display:block;margin-bottom:5px;margin-top:14px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;border-radius:var(--r);border:1px solid var(--borderl);background:var(--fb);color:var(--ft);padding:10px 13px;transition:border .2s;outline:none}
input::placeholder,textarea::placeholder{color:var(--muted2)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
select option{background:var(--card);color:var(--ft)}
textarea{resize:vertical;min-height:60px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);border:1px solid var(--borderl);background:rgba(201,168,76,.1);color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-sm{padding:5px 11px;font-size:10px}
.btn-lg{padding:13px 28px;font-size:12px;width:100%;justify-content:center}
.btn-ok{background:rgba(46,204,113,.1);color:var(--ok);border-color:rgba(46,204,113,.3)}.btn-ok:hover{background:var(--ok);color:#fff}
.btn-err{background:rgba(231,76,60,.08);color:var(--err);border-color:rgba(231,76,60,.2)}.btn-err:hover{background:var(--err);color:#fff}
.btn-inf{background:rgba(52,152,219,.1);color:var(--inf);border-color:rgba(52,152,219,.3)}.btn-inf:hover{background:var(--inf);color:#fff}
.btn-ghost{background:transparent;border-color:var(--borderl);color:var(--muted)}.btn-ghost:hover{background:rgba(255,255,255,.06);color:var(--ft)}
/* HEADER */
#app{display:none}
.hdr{position:sticky;top:0;z-index:200;background:var(--ink2);border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;gap:12px}
.hdr-logo{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(201,168,76,.4));flex-shrink:0}
.hdr-brand h1{font-size:17px;color:var(--gold);letter-spacing:2px}
.hdr-brand p{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr-user{font-size:11px;color:var(--muted)}
/* NAV */
.nav{display:flex;background:var(--ink3);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:63px;z-index:199}
.nav::-webkit-scrollbar{display:none}
.nav-grp{display:flex;align-items:center;border-right:1px solid var(--border);padding:0 2px}
.nav-grp:last-child{border-right:none}
.nav-lbl{font-size:8px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);padding:0 6px;white-space:nowrap}
.nb{padding:10px 10px;font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;text-transform:uppercase;transition:all .2s}
.nb:hover{color:var(--gold);background:rgba(201,168,76,.05)}
.nb.active{color:var(--gold);border-bottom-color:var(--gold)}
/* CONTENT */
.content{padding:20px;max-width:1400px;margin:0 auto}
.sec{display:none}.sec.active{display:block}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
/* CARDS */
.card{background:var(--card);border:.5px solid var(--border);border-radius:var(--r2);padding:16px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--gold)}
/* METRICS */
.met{background:var(--card2);border:.5px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.met-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.met-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600}
.met-val.gold{color:var(--gold)}.met-val.ok{color:var(--ok)}.met-val.err{color:var(--err)}.met-val.warn{color:var(--warn)}
.met-sub{font-size:10px;color:var(--muted);margin-top:3px}
/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 11px;color:var(--muted);font-weight:600;font-size:9px;letter-spacing:.8px;text-transform:uppercase;border-bottom:.5px solid var(--border);white-space:nowrap}
td{padding:8px 11px;border-bottom:.5px solid rgba(201,168,76,.06);color:#D5C8A8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,168,76,.04)}
.empty-row{text-align:center;padding:36px;color:var(--muted);font-size:12px}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.b-m{background:rgba(52,152,219,.15);color:#5DADE2}
.b-f{background:rgba(231,76,60,.1);color:#EC7063}
.b-u{background:rgba(201,168,76,.12);color:var(--gold)}
.b-ok{background:rgba(46,204,113,.1);color:var(--ok)}
.b-warn{background:rgba(240,165,0,.1);color:var(--warn)}
.b-err{background:rgba(231,76,60,.1);color:var(--err)}
.b-inf{background:rgba(52,152,219,.1);color:var(--inf)}
/* ALERTS */
.al{padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.al-ok{background:rgba(46,204,113,.08);color:var(--ok);border:.5px solid rgba(46,204,113,.25)}
.al-warn{background:rgba(240,165,0,.1);color:var(--warn);border:.5px solid rgba(240,165,0,.3)}
.al-err{background:rgba(231,76,60,.08);color:var(--err);border:.5px solid rgba(231,76,60,.2)}
.al-inf{background:rgba(52,152,219,.08);color:#5DADE2;border:.5px solid rgba(52,152,219,.25)}
/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.mo.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--borderl);border-radius:var(--r3);padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.mbox::-webkit-scrollbar{width:4px}
.mbox::-webkit-scrollbar-thumb{background:var(--borderl);border-radius:2px}
.mo-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:.5px solid var(--border)}
.mo-hdr h2{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--gold)}
.mo-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1}
.mo-close:hover{color:var(--err)}
/* MISC */
.divl{height:.5px;background:var(--border);margin:14px 0}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.sec-hdr h2{font-family:'Cormorant Garamond',serif;font-size:22px}
.tabs{display:flex;gap:4px;background:var(--ink3);padding:4px;border-radius:var(--r);margin-bottom:14px}
.tab{flex:1;padding:7px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;text-align:center;border-radius:var(--r);cursor:pointer;color:var(--muted);border:none;background:none;transition:all .2s}
.tab.active{background:var(--card);color:var(--gold);border:.5px solid var(--border)}
.prog-wrap{height:5px;background:rgba(201,168,76,.1);border-radius:3px;overflow:hidden;margin-top:6px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:3px;transition:width .4s}
.bom-row{display:flex;gap:8px;align-items:center;background:var(--card2);border:.5px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:6px}
.bom-row select,.bom-row input{flex:1;margin:0}
.bom-row .unit{font-size:11px;color:var(--muted);min-width:30px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--borderl);border-radius:var(--r);padding:12px 18px;color:var(--gold2);font-size:12px;z-index:500;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--muted)}
.row-act{display:flex;gap:6px}
@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}.content{padding:12px}.hdr-brand p{display:none}}
</style>
</head>
<body>

<!-- ════════════ LOGIN ════════════ -->
<div id="login-wrap" class="login-wrap">
  <div class="login-box">
    <img class="login-logo" id="login-logo" alt="V&F">
    <h1>V&amp;F</h1>
    <div class="sub">Jewelry &amp; Parfum · Sistema</div>
    <div id="lf-in">
      <label>Correo electrónico</label>
      <input type="email" id="l-email" placeholder="tu@correo.com" autocomplete="email">
      <label>Contraseña</label>
      <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
      <button class="btn btn-lg" style="margin-top:18px" onclick="doLogin()">Entrar</button>
      <p class="l-err" id="l-err"></p>
      <p class="l-link" onclick="showReg()">Crear cuenta nueva</p>
    </div>
    <div id="lf-reg" style="display:none">
      <label>Correo electrónico</label>
      <input type="email" id="r-email" placeholder="tu@correo.com">
      <label>Contraseña (mín. 6 caracteres)</label>
      <input type="password" id="r-pass" placeholder="••••••••">
      <button class="btn btn-lg" style="margin-top:18px" onclick="doReg()">Crear cuenta</button>
      <p class="l-err" id="r-err"></p>
      <p class="l-link" onclick="showLogin()">Ya tengo cuenta</p>
    </div>
  </div>
</div>

<!-- ════════════ APP ════════════ -->
<div id="app">
  <header class="hdr">
    <img class="hdr-logo" id="app-logo" alt="V&F">
    <div class="hdr-brand">
      <h1>V&amp;F JEWELRY &amp; PARFUM</h1>
      <p>Sistema de Gestión</p>
    </div>
    <div class="hdr-right">
      <span class="hdr-user" id="hdr-user"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Salir</button>
    </div>
  </header>
  <nav class="nav">
    <div class="nav-grp"><button class="nb active" data-sec="dash">Dashboard</button></div>
    <div class="nav-grp">
      <span class="nav-lbl">Catálogo</span>
      <button class="nb" data-sec="productos">Productos</button>
      <button class="nb" data-sec="mp">Mat. Primas</button>
    </div>
    <div class="nav-grp">
      <span class="nav-lbl">Operaciones</span>
      <button class="nb" data-sec="compras">Compras</button>
      <button class="nb" data-sec="produccion">Producción</button>
      <button class="nb" data-sec="ventas">Ventas</button>
    </div>
    <div class="nav-grp">
      <span class="nav-lbl">Inventario</span>
      <button class="nb" data-sec="smp">Stock MP</button>
      <button class="nb" data-sec="spt">Stock PT</button>
    </div>
    <div class="nav-grp">
      <span class="nav-lbl">Finanzas</span>
      <button class="nb" data-sec="gastos">Gastos</button>
      <button class="nb" data-sec="reportes">Reportes</button>
      <button class="nb" data-sec="cierres">Cierres</button>
    </div>
    <div class="nav-grp"><button class="nb" data-sec="config">Config</button></div>
  </nav>
  <div class="content">
    <div id="s-dash"      class="sec active"></div>
    <div id="s-productos" class="sec"></div>
    <div id="s-mp"        class="sec"></div>
    <div id="s-compras"   class="sec"></div>
    <div id="s-produccion"class="sec"></div>
    <div id="s-ventas"    class="sec"></div>
    <div id="s-smp"       class="sec"></div>
    <div id="s-spt"       class="sec"></div>
    <div id="s-gastos"    class="sec"></div>
    <div id="s-reportes"  class="sec"></div>
    <div id="s-cierres"   class="sec"></div>
    <div id="s-config"    class="sec"></div>
  </div>
</div>

<!-- MODALES -->
<div class="mo" id="mo-producto"><div class="mbox" id="mbox-producto"></div></div>
<div class="mo" id="mo-mp"      ><div class="mbox" id="mbox-mp"      ></div></div>
<div class="mo" id="mo-compra"  ><div class="mbox" id="mbox-compra"  ></div></div>
<div class="mo" id="mo-op"      ><div class="mbox" id="mbox-op"      ></div></div>
<div class="mo" id="mo-venta"   ><div class="mbox" id="mbox-venta"   ></div></div>
<div class="mo" id="mo-gasto"   ><div class="mbox" id="mbox-gasto"   ></div></div>
<div class="mo" id="mo-prov"    ><div class="mbox" id="mbox-prov"    ></div></div>
<div class="mo" id="mo-canal"   ><div class="mbox" id="mbox-canal"   ></div></div>
<div class="toast" id="toast"></div>

// ══════════════════════════════════════════════
// SUPABASE CLIENT
// ══════════════════════════════════════════════
const sb = {
  headers(tok){
    const h = {'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(tok||SB_KEY)};
    return h;
  },
  async rpc(fn, params={}, tok){
    const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:this.headers(tok),body:JSON.stringify(params)});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async get(table, params='', tok){
    const r = await fetch(`${SB_URL}/rest/v1/${table}${params?'?'+params:''}`,{headers:{...this.headers(tok),'Prefer':'return=representation'}});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async post(table, body, tok){
    const r = await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{...this.headers(tok),'Prefer':'return=representation'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async patch(table, id, body, tok){
    const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`,{method:'PATCH',headers:{...this.headers(tok),'Prefer':'return=representation'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async del(table, id, tok){
    const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`,{method:'DELETE',headers:this.headers(tok)});
    if(!r.ok) throw new Error(await r.text());
    return true;
  },
  // AUTH
  async signIn(email, password){
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({email,password})});
    return r.json();
  },
  async signUp(email, password){
    const r = await fetch(`${SB_URL}/auth/v1/signup`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({email,password})});
    return r.json();
  },
  async signOut(tok){
    await fetch(`${SB_URL}/auth/v1/logout`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok}});
  }
};

const fechaDT = s => s ? new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const hoy = () => new Date().toISOString().slice(0,10);

function toast(msg, type='ok'){
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = type==='ok'?'rgba(46,204,113,.4)':type==='err'?'rgba(231,76,60,.4)':'rgba(201,168,76,.4)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
function showLogin(){ $('lf-in').style.display=''; $('lf-reg').style.display='none'; }
function showReg()  { $('lf-in').style.display='none'; $('lf-reg').style.display=''; }

async function doLogin(){
  const email=$('l-email').value.trim(), pass=$('l-pass').value;
  if(!email||!pass){$('l-err').textContent='Completa los campos.';return;}
  $('l-err').textContent='Verificando...';
  const res = await sb.signIn(email, pass);
  if(res.error){ $('l-err').textContent=res.error.message||'Error al iniciar sesión.'; return; }
  SESSION = res;
  // Cargar perfil y verificar activo
  const perfiles = await sb.get('perfiles', `id=eq.${res.user.id}&select=*`, res.access_token);
  if(!perfiles || perfiles.length === 0){
    $('l-err').textContent='Tu usuario no tiene perfil asignado. Contacta al administrador.';
    await sb.signOut(res.access_token); SESSION=null; return;
  }
  const perfil = perfiles[0];
  if(!perfil.activo){
    $('l-err').textContent='Tu acceso está desactivado. Contacta al administrador.';
    await sb.signOut(res.access_token); SESSION=null; return;
  }
  SESSION.perfil = perfil;
  bootApp(perfil.nombre || res.user.email);
}

async function doReg(){
  const email=$('r-email').value.trim(), pass=$('r-pass').value;
  if(!email||!pass||pass.length<6){$('r-err').textContent='Completa los campos (mín. 6 caracteres).';return;}
  $('r-err').textContent='Creando cuenta...';
  const res = await sb.signUp(email, pass);
  if(res.error){ $('r-err').textContent=res.error.message; return; }
  $('r-err').textContent='';
  toast('Cuenta creada. Revisa tu correo para confirmar.');
  showLogin();
}

async function doLogout(){
  if(tok()) await sb.signOut(tok());
  SESSION = null;
  $('app').style.display='none';
  $('login-wrap').style.display='flex';
}

function bootApp(email){
  $('login-wrap').style.display='none';
  $('app').style.display='block';
  $('hdr-user').textContent = email;
  // Ocultar tab Config para no-admin
  const cfgTab = document.querySelector('.nb[data-sec="config"]');
  if(cfgTab && SESSION.perfil?.rol !== 'admin') cfgTab.style.display='none';
  // nav
  document.querySelectorAll('.nb').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const sec = b.dataset.sec;
      document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
      $('s-'+sec).classList.add('active');
      renderSec(sec);
    });
  });
  Promise.all([loadCache()]).then(()=>renderSec('dash'));
}

async function loadCache(){
  try{
    const [p,m,pr,c] = await Promise.all([
      sb.get('productos','select=id,nombre,tipo,genero,precio_base,activo&order=nombre',tok()),
      sb.get('materias_primas','select=id,nombre,unidad,costo_vigente,activo&order=nombre',tok()),
      sb.get('proveedores','select=id,nombre&order=nombre',tok()),
      sb.get('canales_venta','select=id,nombre,tipo&order=nombre',tok()),
    ]);
    CACHE.productos=p||[]; CACHE.mp=m||[]; CACHE.proveedores=pr||[]; CACHE.canales=c||[];
  }catch(e){console.error('cache',e);}
}

function renderSec(sec){
  const fns = {
    dash:renderDash, productos:renderProductos, mp:renderMP,
    compras:renderCompras, produccion:renderProduccion, ventas:renderVentas,
    smp:renderStockMP, spt:renderStockPT,
    gastos:renderGastos, reportes:renderReportes, cierres:renderCierres,
    config:renderConfig
  };
  if(fns[sec]) fns[sec]();
}

function navTo(sec){

let _lineasCompra = 0;
function addLineaCompra(){
  const i = _lineasCompra++;
  const div = document.createElement('div');
  div.className='bom-row'; div.id=`cl-${i}`;
  div.innerHTML = `
<select class="cl-mp" style="flex:2"><option value="">— MP —</option>
  ${CACHE.mp.map(m=>`<option value="${m.id}" data-unit="${m.unidad}">${m.nombre}</option>`).join('')}
</select>

<input class="cl-cost" type="number" placeholder="Costo/U" style="min-width:90px">
<button class="btn btn-sm btn-err" onclick="this.parentElement.remove()">✕</button>`;
  $('cmp-lineas').appendChild(div);
}

async function guardarCompra(){
  const provId=$('cmp-prov').value||null, fec=$('cmp-fecha').value, folio=$('cmp-folio').value.trim(), notas=$('cmp-notas').value.trim();
  const lineas=[...document.querySelectorAll('#cmp-lineas .bom-row')].map(r=>({
    mp_id:r.querySelector('.cl-mp').value, qty:parseFloat(r.querySelector('.cl-qty').value),
    cost:parseFloat(r.querySelector('.cl-cost').value)
  })).filter(l=>l.mp_id&&l.qty>0);
  if(!fec||lineas.length===0){toast('Fecha y al menos 1 MP requeridos','err');return;}
  const total = lineas.reduce((s,l)=>s+(l.qty*(l.cost||0)),0);
  try{
    // Crear cabecera
    const [recibo] = await sb.post('recibos',{proveedor_id:provId,fecha:fec,folio:folio||null,total,notas:notas||null,user_id:SESSION.user.id},tok());
    // Crear líneas + movimientos MP
    for(const l of lineas){
      await sb.post('recibo_lineas',{recibo_id:recibo.id,mp_id:l.mp_id,cantidad:l.qty,precio_unitario:l.cost||null,user_id:SESSION.user.id},tok());
      await sb.post('mov_mp',{mp_id:l.mp_id,tipo:'entrada',cantidad:l.qty,ref_tipo:'recibos',ref_id:recibo.id,user_id:SESSION.user.id},tok());
    }
    closeModal('mo-compra'); toast('Compra registrada'); renderCompras(); await loadCache();
  }catch(e){toast(e.message,'err');}
}

async function guardarOP(){
  const prodId=$('op-prod').value, fec=$('op-fecha').value, folio=$('op-folio').value.trim();
  const cant=parseFloat($('op-cant').value), estatus=$('op-estado').value, notas=$('op-notas').value.trim();
  if(!prodId||!fec||!cant){toast('Producto, fecha y cantidad requeridos','err');return;}
  try{
    const [op]=await sb.post('ordenes_produccion',{producto_id:prodId,fecha:fec,folio:folio||null,estatus,notas:notas||null,user_id:SESSION.user.id},tok());
    await sb.post('op_lineas',{op_id:op.id,producto_id:prodId,cantidad:cant,user_id:SESSION.user.id},tok());
    // Movimiento de entrada PT
    await sb.post('mov_producto',{producto_id:prodId,tipo:'entrada',cantidad:cant,ref_tipo:'ordenes_produccion',ref_id:op.id,user_id:SESSION.user.id},tok());
    // Descuento MP según BOM
    if(estatus==='cerrada'){
      const bom=await sb.get('bom',`producto_id=eq.${prodId}&select=*`,tok());
      for(const b of bom){
        await sb.post('mov_mp',{mp_id:b.mp_id,tipo:'salida',cantidad:b.cantidad*cant,ref_tipo:'ordenes_produccion',ref_id:op.id,user_id:SESSION.user.id},tok());
      }
    }
    closeModal('mo-op'); toast('OP registrada'); renderProduccion();
  }catch(e){toast(e.message,'err');}
}

function addLineaVenta(){
  const i=_lineasVenta++;
  const div=document.createElement('div'); div.className='bom-row'; div.id=`vl-${i}`;
  div.innerHTML=`
<select class="vl-prod" style="flex:2" onchange="calcTotalVenta()">
  <option value="">— Producto —</option>
  ${CACHE.productos.filter(p=>p.activo).map(p=>`<option value="${p.id}" data-precio="${p.precio_base||0}">${p.nombre}</option>`).join('')}
</select>
<input class="vl-qty" type="number" value="1" min="1" placeholder="Cant." style="min-width:60px" oninput="calcTotalVenta()">
<input class="vl-precio" type="number" placeholder="Precio" style="min-width:90px" oninput="calcTotalVenta()">
<button class="btn btn-sm btn-err" onclick="this.parentElement.remove();calcTotalVenta()">✕</button>`;
  $('vt-lineas').appendChild(div);
  // auto-fill precio
  div.querySelector('.vl-prod').addEventListener('change',function(){
    const opt=this.options[this.selectedIndex];
    div.querySelector('.vl-precio').value=opt.dataset.precio||'';
    calcTotalVenta();
  });
}

function calcTotalVenta(){
  const total=[...document.querySelectorAll('#vt-lineas .bom-row')].reduce((s,r)=>{
    const qty=parseFloat(r.querySelector('.vl-qty').value)||0;
    const p=parseFloat(r.querySelector('.vl-precio').value)||0;
    return s+qty*p;
  },0);
  $('vt-total').textContent='Total: '+mxn(total);
}

async function guardarVenta(){
  const canalId=$('vt-canal').value||null, fec=$('vt-fecha').value, pago=$('vt-pago').value;
  const folio=$('vt-folio').value.trim(), notas=$('vt-notas').value.trim();
  const lineas=[...document.querySelectorAll('#vt-lineas .bom-row')].map(r=>({
    prod_id:r.querySelector('.vl-prod').value, qty:parseFloat(r.querySelector('.vl-qty').value),
    precio:parseFloat(r.querySelector('.vl-precio').value)
  })).filter(l=>l.prod_id&&l.qty>0&&l.precio>0);
  if(!fec||lineas.length===0){toast('Fecha y al menos 1 producto requeridos','err');return;}
  try{
    const [venta]=await sb.post('ventas',{canal_id:canalId,fecha:fec,tipo_pago:pago,folio:folio||null,notas:notas||null,user_id:SESSION.user.id},tok());
    for(const l of lineas){
      // Obtener costo del producto
      let costo=0;
      try{ costo=await sb.rpc('fn_costo_producto',{prod_id:l.prod_id},tok()); }catch(_){}
      await sb.post('venta_lineas',{venta_id:venta.id,producto_id:l.prod_id,cantidad:l.qty,precio_unitario:l.precio,costo_unitario:costo||0,user_id:SESSION.user.id},tok());
      // Movimiento salida PT
      await sb.post('mov_producto',{producto_id:l.prod_id,tipo:'salida',cantidad:l.qty,ref_tipo:'ventas',ref_id:venta.id,user_id:SESSION.user.id},tok());
    }
    closeModal('mo-venta'); toast('Venta registrada'); renderVentas();
  }catch(e){toast(e.message,'err');}
}

function tabReporte(btn, show){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

function buildTablaUsuarios(usuarios){
  const tbody = document.getElementById('tbl-usuarios');
  if(!tbody) return;
  if(!usuarios || !usuarios.length){
    tbody.innerHTML = '<tr><td colspan="5" class="empty-row">Sin usuarios.</td></tr>';
    return;
  }
  const rows = [];
  for(const u of usuarios){
    const isMe = (u.id === SESSION.user.id);
    const opts = ['admin','vendedor','operador'].map(function(r){
      return '<option value="' + r + '"' + (u.rol===r?' selected':'') + '>' + r + '</option>';
    }).join('');
    const sel = '<select data-uid="' + u.id + '" onchange="cambiarRolUsuario(this.dataset.uid,this.value)" style="font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--fg)">' + opts + '</select>';
    const badge = '<span class="badge ' + (u.activo?'b-ok':'b-err') + '">' + (u.activo?'Activo':'Inactivo') + '</span>';
    let btn;
    if(isMe){
      btn = '<span style="font-size:10px;color:var(--muted)">Tu cuenta</span>';
    } else {
      const label = u.activo ? 'Desactivar' : 'Activar';
      const cls = u.activo ? 'btn-warn' : 'btn-ok';
      btn = '<button class="btn btn-sm ' + cls + '" onclick="toggleUsuario(' + JSON.stringify(u.id) + ',' + String(u.activo) + ')">' + label + '</button>';
    }
    rows.push('<tr>'
      + '<td><strong>' + (u.nombre||'—') + '</strong></td>'
      + '<td style="font-size:10px;color:var(--muted)">' + u.id.substring(0,12) + '…</td>'
      + '<td>' + sel + '</td>'
      + '<td>' + badge + '</td>'
      + '<td>' + btn + '</td>'
      + '</tr>');
  }
  tbody.innerHTML = rows.join('');
}


async function cambiarRolUsuario(uid, rol){
  try{
    await sb.patch('perfiles', uid, {rol}, tok());
    toast('Rol actualizado');
  }catch(e){ toast('Error: '+e.message, true); }
}

async function toggleUsuario(uid, activo){
  try{
    await sb.patch('perfiles', uid, {activo: !activo}, tok());
    toast(activo ? 'Usuario desactivado' : 'Usuario activado');
    renderConfig();
  }catch(e){ toast('Error: '+e.message, true); }
}
